name: Actualizar radar

on:
  schedule:
    # 12:00 UTC = 7:00 am en Lima, todos los días
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python fetch_news.py

      - name: Guardar cambios
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || git commit -m "Actualizar noticias"
          git push
