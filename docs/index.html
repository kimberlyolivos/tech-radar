<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F2F2;
    --card: #FFFFFF;
    --ink: #111111;
    --muted: #666666;
    --line: #E2E2E2;
    --primary: #111111;
    --on-primary: #FFFFFF;
    --tile: #EBEBEB;
    --shadow: 0 6px 20px rgba(0, 0, 0, .06);
    --pop: 0 16px 36px rgba(0, 0, 0, .18);
    --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D0D0D; --card: #171717; --ink: #F2F2F2; --muted: #A0A0A0; --line: #2A2A2A;
      --primary: #F2F2F2; --on-primary: #111111; --tile: #222222;
      --shadow: none; --pop: 0 16px 36px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); }
  main, .top { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button { font-family: inherit; }

  .top { padding-top: 22px; }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }

  .hello { margin-top: 26px; }
  .hi { margin: 0; font-size: 2rem; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
  .sparks { display: inline-flex; align-items: flex-start; gap: 3px; margin-left: 4px; vertical-align: .12em; }
  .sparks svg { fill: var(--ink); }
  .sp1 { width: .62em; height: .62em; }
  .sp2 { width: .32em; height: .32em; margin-top: -.02em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }

  .search { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding: 0 18px;
            height: 50px; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }
  .search svg { flex: none; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
                  font: 400 .95rem var(--font); color: var(--ink); }
  .search input::placeholder { color: var(--muted); }
  .search:focus-within { outline: 2px solid var(--ink); }

  /* Botón Fuentes con menú desplegable */
  .menu { position: relative; margin-top: 14px; }
  .menu-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .menu-btn { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; border: 0;
              border-radius: 999px; padding: 10px 18px; background: var(--card); color: var(--ink);
              font: 600 .92rem var(--font); box-shadow: var(--shadow); }
  .menu-btn::after { content: ""; width: 7px; height: 7px; margin-top: -3px;
                     border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
                     transform: rotate(45deg); transition: transform .18s; }
  .menu-btn[aria-expanded="true"] { background: var(--primary); color: var(--on-primary); }
  .menu-btn[aria-expanded="true"]::after { margin-top: 3px; transform: rotate(-135deg); }
  .panel { position: absolute; left: 0; z-index: 20; width: min(100%, 640px);
           max-height: 70vh; overflow-y: auto; padding: 16px 18px 18px; background: var(--card);
           border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--pop);
           animation: drop .16s ease-out; }
  .panel[hidden] { display: none; }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
  .panel h3 { margin: 16px 0 8px; font-size: .78rem; font-weight: 600; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a { padding: 6px 14px; border-radius: 999px; background: var(--tile); color: var(--ink);
             text-decoration: none; font-size: .85rem; font-weight: 500; }
  .links a:hover { background: var(--primary); color: var(--on-primary); }

  /* Noticias */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 0 12px; }
  h2 { margin: 0; font-size: 1rem; font-weight: 700; }
  .updated { color: var(--muted); font-size: .75rem; text-align: right; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .filters button, .filters select { font: 500 .85rem var(--font); padding: 8px 16px; border-radius: 999px;
    border: 0; background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .filters button { cursor: pointer; }
  .filters button.on { background: var(--primary); color: var(--on-primary); }

  #list { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 900px) { #list { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  .day { grid-column: 1 / -1; margin: 22px 0 0; font-size: .88rem; font-weight: 600; color: var(--muted); }
  .news { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border-radius: 18px;
          padding: 14px; margin: 0; box-shadow: var(--shadow); overflow-wrap: anywhere; }
  .news .ic { flex: none; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
              font-weight: 700; background: var(--primary); color: var(--on-primary); }
  .news .ic.ia { background: var(--tile); color: var(--ink); }
  .news a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: .96rem; line-height: 1.35; }
  .news a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .sum { margin: 4px 0 0; color: var(--muted); font-size: .84rem; display: -webkit-box;
         -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .by { margin-top: 8px; display: flex; gap: 12px; font-size: .75rem; color: var(--muted); }
  .by .src { color: var(--ink); font-weight: 600; }
  #list .empty { grid-column: 1 / -1; }
  .empty, .errors { color: var(--muted); font-size: .88rem; margin: 24px 0 90px; }

  .fab { position: fixed; right: 18px; bottom: 18px; width: 50px; height: 50px; border: 0; border-radius: 50%;
         background: var(--primary); color: var(--on-primary); box-shadow: var(--pop); cursor: pointer;
         display: grid; place-items: center; z-index: 30; }
  .fab[hidden] { display: none; }
</style>
</head>
<body>
<header class="top">
  <h1>Radar Tech</h1>
</header>
<main>
  <section class="hello">
    <p class="hi">Hola <span class="sparks" aria-hidden="true"><svg class="sp1" viewBox="0 0 24 24"><path d="M12 1C12 7 17 12 23 12C17 12 12 17 12 23C12 17 7 12 1 12C7 12 12 7 12 1Z"/></svg><svg class="sp2" viewBox="0 0 24 24"><polygon points="12,1 15.1,8.4 23,9.2 17,14.4 18.8,22.2 12,18 5.2,22.2 7,14.4 1,9.2 8.9,8.4"/></svg></span></p>
    <p class="sub">Esto es lo nuevo en tech</p>
  </section>

  <label class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Buscar noticias" aria-label="Buscar noticias">
  </label>

  <div class="menu" id="menu">
    <div class="menu-row" id="menuRow"></div>
    <div class="panel" id="panel" hidden></div>
  </div>

  <div class="head">
    <h2>Noticias</h2>
    <span class="updated" id="updated"></span>
  </div>
  <div class="filters">
    <button data-cat="all" class="on">Todo</button>
    <button data-cat="general">Tech general</button>
    <button data-cat="ia">IA / ML</button>
    <select id="source" aria-label="Filtrar por fuente"><option value="">Todas las fuentes</option></select>
  </div>
  <div id="list"></div>
  <div class="errors" id="errors"></div>
</main>

<button class="fab" id="up" hidden aria-label="Volver arriba">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
const state = { items: [], cat: "all", source: "", q: "" };

// Acceso directo a cada fuente (para agregar una, suma una línea aquí y su feed en feeds.json)
const SOURCES = {
  "Tech general": [
    ["Hacker News", "https://news.ycombinator.com"],
    ["TechCrunch", "https://techcrunch.com"],
    ["The Verge", "https://www.theverge.com"],
    ["Ars Technica", "https://arstechnica.com"],
    ["Wired", "https://www.wired.com"],
    ["MIT Technology Review", "https://www.technologyreview.com"],
    ["Engadget", "https://www.engadget.com"],
    ["9to5Google", "https://9to5google.com"],
    ["9to5Mac", "https://9to5mac.com"]
  ],
  "IA / ML": [
    ["Hugging Face Blog", "https://huggingface.co/blog"],
    ["OpenAI", "https://openai.com/news"],
    ["Anthropic", "https://www.anthropic.com/news"],
    ["Google DeepMind", "https://deepmind.google/blog/"],
    ["Google AI", "https://blog.google/technology/ai/"],
    ["VentureBeat AI", "https://venturebeat.com/category/ai/"],
    ["MarkTechPost", "https://www.marktechpost.com"],
    ["Import AI", "https://importai.substack.com"]
  ],
  "Blogs de empresas": [
    ["Netflix TechBlog", "https://netflixtechblog.com"],
    ["Meta Engineering", "https://engineering.fb.com"],
    ["Uber Engineering", "https://www.uber.com/blog/engineering/"],
    ["Airbnb Engineering", "https://medium.com/airbnb-engineering"],
    ["Spotify Engineering", "https://engineering.atspotify.com"],
    ["Cloudflare", "https://blog.cloudflare.com"],
    ["GitHub Blog", "https://github.blog"],
    ["Vercel", "https://vercel.com/blog"],
    ["web.dev", "https://web.dev/blog"],
    ["Google Developers", "https://developers.googleblog.com"],
    ["AWS", "https://aws.amazon.com/blogs/aws/"]
  ],
  "Concursos y comunidad": [
    ["Kaggle", "https://www.kaggle.com/competitions"],
    ["Devpost", "https://devpost.com/hackathons"],
    ["MLH", "https://mlh.io"],
    ["Product Hunt", "https://www.producthunt.com"]
  ]
};

/* Un botón-menú por sección */
const menuEl = document.getElementById("menu"), row = document.getElementById("menuRow"), panel = document.getElementById("panel");
let openKey = null;
row.innerHTML = Object.keys(SOURCES).map(g =>
  `<button class="menu-btn" type="button" data-g="${g}" aria-expanded="false" aria-controls="panel">${g}</button>`).join("");
const btns = [...row.querySelectorAll(".menu-btn")];
function closeMenu(focusBtn) {
  const b = btns.find(x => x.dataset.g === openKey);
  panel.hidden = true; openKey = null;
  btns.forEach(x => x.setAttribute("aria-expanded", "false"));
  if (focusBtn && b) b.focus();
}
btns.forEach(btn => btn.onclick = () => {
  const key = btn.dataset.g;
  if (openKey === key) { closeMenu(); return; }
  closeMenu();
  openKey = key;
  btn.setAttribute("aria-expanded", "true");
  panel.innerHTML = `<div class="links">` +
    SOURCES[key].map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join("") + `</div>`;
  panel.style.top = (row.offsetTop + row.offsetHeight + 8) + "px";
  panel.hidden = false;
});
document.addEventListener("click", e => { if (openKey && !menuEl.contains(e.target)) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && openKey) closeMenu(true); });
window.addEventListener("resize", () => { if (openKey) closeMenu(); });

/* Noticias */
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtDay = d => cap(new Date(d).toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long" }));
const fmtTime = d => new Date(d).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const q = state.q.toLowerCase();
  const rows = state.items.filter(i =>
    (state.cat === "all" || i.category === state.cat) &&
    (!state.source || i.source === state.source) &&
    (!q || (i.title + " " + i.summary).toLowerCase().includes(q)));
  const list = document.getElementById("list");
  if (!rows.length) {
    list.innerHTML = '<div class="empty">No hay noticias con ese filtro. Prueba otra palabra o elige "Todo".</div>';
    return;
  }
  let html = "", lastDay = "";
  for (const i of rows) {
    const day = fmtDay(i.published);
    if (day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
    html += `<article class="news">
      <div class="ic${i.category === "ia" ? " ia" : ""}" aria-hidden="true">${esc(i.source.charAt(0).toUpperCase())}</div>
      <div>
        <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
        ${i.summary ? `<p class="sum">${esc(i.summary)}</p>` : ""}
        <div class="by"><span class="src">${esc(i.source)}</span><span>${fmtTime(i.published)}</span></div>
      </div>
    </article>`;
  }
  list.innerHTML = html;
}

fetch("news.json", { cache: "no-store" }).then(r => r.json()).then(data => {
  state.items = data.items;
  document.getElementById("updated").textContent = "Actualizado " + new Date(data.updated).toLocaleString("es-PE");
  const sel = document.getElementById("source");
  [...new Set(data.items.map(i => i.source))].sort().forEach(s => sel.add(new Option(s, s)));
  const failed = data.status.filter(s => !s.ok).map(s => s.source);
  if (failed.length) document.getElementById("errors").textContent =
    "Estas fuentes no respondieron en la última actualización: " + failed.join(", ") + ".";
  render();
}).catch(() => {
  document.getElementById("list").innerHTML = '<div class="empty">No se pudieron cargar las noticias.</div>';
});

document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-cat]").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); state.cat = b.dataset.cat; render();
});
document.getElementById("source").onchange = e => { state.source = e.target.value; render(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };

/* Botón para volver arriba */
const up = document.getElementById("up");
window.addEventListener("scroll", () => { up.hidden = window.scrollY < 600; }, { passive: true });
up.onclick = () => window.scrollTo({ top: 0 });
</script>
</body>
</html>
