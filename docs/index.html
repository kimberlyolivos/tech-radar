<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Tech</title>
<style>
  :root {
    --bg: #fafaf7; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e4e2da; --accent: #c2410c; --chip: #f0eee6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1e1e1c; --text: #ecebe5; --muted: #98978f;
            --line: #2f2f2b; --accent: #fb923c; --chip: #2a2a26; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 32px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 8px; }
  .controls button, .controls select, .controls input {
    font: inherit; font-size: .9rem; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .controls button { cursor: pointer; }
  .controls button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .controls input { flex: 1; min-width: 160px; border-radius: 8px; }
  .day { margin: 28px 0 8px; font-size: .8rem; text-transform: uppercase;
         letter-spacing: .08em; color: var(--muted); }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 14px 16px; margin-bottom: 10px; }
  article { overflow-wrap: anywhere; }
  article a { color: var(--text); text-decoration: none; font-weight: 600; }
  article a:hover { color: var(--accent); }
  article p { margin: 6px 0 0; color: var(--muted); font-size: .92rem; }
  .tags { margin-top: 8px; display: flex; gap: 6px; align-items: center; font-size: .78rem; color: var(--muted); }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; }
  .empty, .errors { color: var(--muted); font-size: .85rem; margin: 24px 0 48px; }
  .sources { margin: 18px 0 4px; }
  .sources .grp { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .sources .lbl { flex-basis: 100%; font-size: .72rem; text-transform: uppercase;
                  letter-spacing: .08em; color: var(--muted); }
  .sources a { font-size: .82rem; color: var(--text); text-decoration: none;
               padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px;
               background: var(--card); }
  .sources a:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Radar <span>Tech</span></h1>
  <div class="meta" id="meta">Cargando…</div>
  <nav class="sources" id="sources" aria-label="Enlaces a las fuentes"></nav>
  <div class="controls">
    <button data-cat="all" class="on">Todo</button>
    <button data-cat="general">Tech general</button>
    <button data-cat="ia">IA / ML</button>
    <select id="source"><option value="">Todas las fuentes</option></select>
    <input id="q" type="search" placeholder="Buscar…">
  </div>
</header>
<main>
  <div id="list"></div>
  <div class="errors" id="errors"></div>
</main>
<script>
const state = { items: [], cat: "all", source: "", q: "" };

// Acceso directo a cada fuente (para agregar una, suma una línea aquí y su feed en feeds.json)
const SOURCES = {
  "Tech general": [
    ["Hacker News", "https://news.ycombinator.com"],
    ["TechCrunch", "https://techcrunch.com"],
    ["The Verge", "https://www.theverge.com"],
    ["Ars Technica", "https://arstechnica.com"],
    ["Wired", "https://www.wired.com"],
    ["MIT Technology Review", "https://www.technologyreview.com"],
    ["Engadget", "https://www.engadget.com"],
    ["9to5Google", "https://9to5google.com"],
    ["9to5Mac", "https://9to5mac.com"]
  ],
  "IA / ML": [
    ["Hugging Face Blog", "https://huggingface.co/blog"],
    ["OpenAI", "https://openai.com/news"],
    ["Google DeepMind", "https://deepmind.google/blog/"],
    ["Google AI", "https://blog.google/technology/ai/"],
    ["VentureBeat AI", "https://venturebeat.com/category/ai/"],
    ["MarkTechPost", "https://www.marktechpost.com"],
    ["Import AI", "https://importai.substack.com"]
  ]
};
document.getElementById("sources").innerHTML = Object.entries(SOURCES).map(([grp, list]) =>
  `<div class="grp"><span class="lbl">${grp}</span>` +
  list.map(([name, url]) => `<a href="${url}" target="_blank" rel="noopener">${name}</a>`).join("") +
  `</div>`).join("");
const fmtDay = d => new Date(d).toLocaleDateString("es-PE",
  { weekday: "long", day: "numeric", month: "long" });
const fmtTime = d => new Date(d).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const q = state.q.toLowerCase();
  const rows = state.items.filter(i =>
    (state.cat === "all" || i.category === state.cat) &&
    (!state.source || i.source === state.source) &&
    (!q || (i.title + " " + i.summary).toLowerCase().includes(q)));
  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
  let html = "", lastDay = "";
  for (const i of rows) {
    const day = fmtDay(i.published);
    if (day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
    html += `<article>
      <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      ${i.summary ? `<p>${esc(i.summary)}</p>` : ""}
      <div class="tags"><span class="chip">${esc(i.source)}</span><span>${fmtTime(i.published)}</span></div>
    </article>`;
  }
  list.innerHTML = html;
}

fetch("news.json", { cache: "no-store" }).then(r => r.json()).then(data => {
  state.items = data.items;
  document.getElementById("meta").textContent =
    `${data.items.length} noticias · actualizado ${new Date(data.updated).toLocaleString("es-PE")}`;
  const sel = document.getElementById("source");
  [...new Set(data.items.map(i => i.source))].sort().forEach(s => sel.add(new Option(s, s)));
  const failed = data.status.filter(s => !s.ok).map(s => s.source);
  if (failed.length) document.getElementById("errors").textContent =
    "Fuentes que fallaron en la última corrida: " + failed.join(", ");
  render();
}).catch(() => { document.getElementById("meta").textContent = "No se pudo cargar news.json"; });

document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-cat]").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); state.cat = b.dataset.cat; render();
});
document.getElementById("source").onchange = e => { state.source = e.target.value; render(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
</script>
</body>
</html>
